server {
    listen 80;
    server_name _;

    # Redirect /wzam to /wzam/ (add trailing slash)
    location = /wzam {
        return 301 /wzam/;
    }

    # Serve Flutter app at /wzam/
    location /wzam/ {
        alias /usr/share/nginx/html/wzam/;
        try_files $uri $uri/ /wzam/index.html =404;
        index index.html;
        
        # Handle SPA routing - all requests go to index.html
        add_header Cache-Control "no-cache";
    }
}
