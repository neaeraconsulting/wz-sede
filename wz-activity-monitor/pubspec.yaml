name: wzam
description: "Work Zone Activity Manager"
publish_to: "none"
version: 0.4.1+38

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  audioplayers: ^6.4.0
  confetti: ^0.8.0
  connectivity_plus: ^7.0.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_background: ^1.3.0+1
  flutter_background_service: ^5.1.0
  flutter_dotenv: ^5.2.1
  flutter_email_sender: ^7.0.0
  flutter_foreground_task: ^8.17.0
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^19.2.0
  flutter_map: ^7.0.2
  flutter_multi_formatter: ^2.13.7
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.2.2
  fluttertoast: ^8.2.12
  geolocator: ^13.0.2
  get: ^4.6.6
  http: ^1.2.2
  sembast: ^3.7.4
  sembast_web: ^2.4.2
  intl: ^0.20.1
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  plugin_platform_interface: ^2.0.0
  protobuf: ^4.1.0
  quiver: ^3.2.2
  record: ^6.1.2
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  tflite_flutter: ^0.12.1
  url_launcher: ^6.3.1
  flutter_map_marker_cluster: ^1.3.6
  geoxml: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.8.0
  protoc_plugin: ^22.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/marked_location_types/
    - assets/images/arrow_board_types/
    - assets/images/vehicle_impact_types/
    - assets/images/field_device_types/
    - assets/sounds/
    - assets/tflite_models/
    - assets/maps/
    - .env
