syntax = "proto3";

package datahub.v1;

option java_package = "wyo.dot.protobuf.conadmin";
option java_outer_classname = "ConAdminProto";
option java_multiple_files = true;

import "datahub.proto";
import "google/protobuf/timestamp.proto";
import "project.proto";
import "road_event.proto";
import "road_sub_event.proto";

// Interface Messages
message ConAdminFieldDeviceUpdate {
    reserved 3;
    uint64 request_id = 1;
    google.protobuf.Timestamp timestamp = 2;

    // We use oneof here to support easy addition of new message types as the system evolves
    oneof type {
        UpdateFieldDevice updated = 4;
    }
}

message ConAdminProjectUpdate {
    optional uint64 request_id = 1;
    google.protobuf.Timestamp timestamp = 2;
    // We use oneof here to support easy addition of new message types as the system evolves
    oneof type {
        ProjectCreated created = 3;
        ProjectUpdated updated = 4;
        ProjectRemoved removed = 5;
    }
}

message ConAdminRoadEventUpdate {
    optional uint64 request_id = 1;
    google.protobuf.Timestamp timestamp = 2;
    oneof type {
        RoadEventCreated created = 3;
        RoadEventUpdated updated = 4;
        RoadEventRemoved removed = 5;
    }
}

// This message is used to indicate to the Datahub whether the original DataHubRoadEventUpdate message
// was approved or rejected by the TMC Operator when reviewed in the ConAdmin UI.
message ConAdminRoadEventApproval {
  optional uint64 request_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  oneof type {
    RoadEventUpdateApproved approved = 3;
    RoadEventUpdateRejected rejected = 4;
  }
}

// Action Types - not to be used outside of the Interface Types defined above.
message ProjectCreated {
    Project project = 1;
}

message ProjectUpdated {
    Project project = 1;
}

message ProjectRemoved {
  reserved 1;
  uint64 project_id = 2;
}

// Indicates that a RoadEvent was created via the ConAdmin UI
message RoadEventCreated {
    reserved 2;
    RoadEvent road_event = 1;
    repeated RoadSubEvent road_sub_events = 3;
}

// Indicates that a RoadEvent was updated via the ConAdmin UI
message RoadEventUpdated {
    reserved 2,3,4;
    RoadEvent road_event = 1;
    repeated RoadSubEvent road_sub_events = 5;
}

// Indicates that a RoadEvent was deleted via the ConAdmin UI
message RoadEventRemoved {
  reserved 1, 2;
  uint64 road_event_id = 3;
}

// This represents the current state of the approved RoadEvent. It may be different from the original RoadEventUpdate
// message state as the TMC Operators have the option to edit the incoming RoadEvent and RoadSubEvents before approving.
message RoadEventUpdateApproved {
  // the original_request_id is used to relate the DataHubRoadEventUpdate message this approval relates to.
  uint64 original_request_id = 1;

  RoadEvent road_event = 2;
  repeated RoadSubEvent road_sub_events = 3;
}

message RoadEventUpdateRejected {
  // the original_request_id is used to relate the DataHubRoadEventUpdate message this approval relates to.
  uint64 original_request_id = 1;
}