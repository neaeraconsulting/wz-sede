events {
	worker_connections 768;
}

http {
    upstream api {
        server 172.17.0.1:8081;
    }
    upstream message_generator {
        server 172.17.0.1:8092;
    }
    upstream wzam_webapp {
        server 172.17.0.1:3000;
    }
    upstream keycloak {
        server ${KEYCLOAK_ENDPOINT};
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    ##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_dhparam "/etc/nginx/dhparam.pem";
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
    add_header Strict-Transport-Security "max-age=31557600; includeSubDomains";
	ssl_stapling on;
	ssl_stapling_verify on;

	##
	# General Logging Settings
	##

	access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    
    # HTTP forwards everything to HTTPS
	#
	server {
		listen 80;

		server_name $SERVER_HOST;

		location / {
	            return 301 https://$host$request_uri; 
		}

		# deny access to .htaccess files, if Apache's document root
		# concurs with nginx's one
		location ~ /\.ht {
			deny all;
		}
    }

    server {
        listen 443 default_server ssl;
        server_name $SERVER_HOST;

        ssl_certificate     /etc/ssl/certs/nginx_server.crt;
		ssl_certificate_key /etc/ssl/private/nginx_server.key;

        ssl_client_certificate /etc/nginx/client_certs/ca.crt;
        
        # mTLS configuration:
        ssl_verify_client      on;
        ssl_verify_depth 10;

	merge_slashes on;


        client_max_body_size 300M;

	location ~ /\.ht {
            deny all;
        }

        location ${DATAHUB_BASE_API_PATH}/ {            
            rewrite ^([^.]*?)(\/+)(.+)$ $1/$3 break;

            proxy_pass http://api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        location ${MESSAGE_GENERATOR_BASE_API_PATH}/ {            
            rewrite ^([^.]*?)(\/+)(.+)$ $1/$3 break;

            proxy_pass http://message_generator/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        location ${WZAM_BASE_API_PATH}/ {            
            rewrite ^([^.]*?)(\/+)(.+)$ $1/$3 break;

            proxy_pass http://wzam_webapp/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        location /realms/wzam {
	    rewrite ^([^.]*?)(\/+)(.+)$ $1/$3 break;            
            proxy_pass http://keycloak/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        location /admin/realms/wzam {
	    rewrite ^([^.]*?)(\/+)(.+)$ $1/$3 break;            
            proxy_pass http://keycloak/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        location /realms/master {
            proxy_pass http://keycloak/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        location /resources {
	    rewrite ^([^.]*?)(\/+)(.+)$ $1/$3 break;
            proxy_pass http://keycloak/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }
    }
}
